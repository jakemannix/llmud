[project]
name = "backstabbr-mcp"
version = "0.1.0"
description = "MCP server for interacting with the Backstabbr online Diplomacy platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
backstabbr-mcp = "backstabbr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstabbr_mcp"]
